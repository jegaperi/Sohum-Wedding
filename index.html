<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sohum &amp; Isha</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffffff">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Space+Grotesk:wght@400;500;600&display=swap');

  :root{
    --ink:#000000;
    --bg-deep:#ffffff;
    --bg-deeper:#ffffff;
    --bg-panel:#f0f0f0;
    --gold:#e3a53d;
    --gold-dim:#a97a2e;
    --magenta:#c8447a;
    --emerald:#3f8f6f;
    --line: rgba(0,0,0,0.14);
    --muted: rgba(0,0,0,0.62);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0; overscroll-behavior-y:none;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, rgba(227,165,61,0.10), transparent 55%),
      radial-gradient(ellipse at 90% 10%, rgba(200,68,122,0.08), transparent 50%),
      var(--bg-deep);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    -webkit-font-smoothing:antialiased;
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    padding-bottom:calc(96px + var(--safe-b));
  }

  /* ---------- TOP BAR ---------- */
  .topbar{
    padding:calc(16px + var(--safe-t)) 20px 14px;
    text-align:center;
    border-bottom:1px solid var(--line);
    position:relative;
    overflow:hidden;
  }
  .topbar::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(135deg, rgba(227,165,61,0.05) 0 2px, transparent 2px 26px),
      repeating-linear-gradient(45deg, rgba(200,68,122,0.05) 0 2px, transparent 2px 26px);
    pointer-events:none;
  }
  .eyebrow{
    font-size:10.5px; letter-spacing:0.26em; text-transform:uppercase;
    color:var(--gold); font-weight:500; margin-bottom:8px; position:relative;
  }
  .topbar h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:30px;
    line-height:1.05;
    margin:0 0 6px;
    position:relative;
  }
  .topbar h1 em{font-style:italic; color:var(--gold); font-weight:300;}
  .topbar .sub{
    color:var(--muted); font-size:13px; position:relative;
  }
  .stay-note{
    color:var(--gold-dim); font-size:11.5px; margin-top:8px;
    position:relative; font-weight:500;
  }

  /* ---------- DAY TABS ---------- */
  .day-tabs{
    display:flex;
    gap:8px;
    padding:14px 16px;
    overflow-x:auto;
    scrollbar-width:none;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    z-index:40;
    background:rgba(255,255,255,0.92);
    backdrop-filter:blur(10px);
  }
  .day-tabs::-webkit-scrollbar{display:none;}
  .day-tab{
    flex:none;
    font-family:'Space Grotesk', sans-serif;
    font-size:13px;
    font-weight:500;
    padding:9px 16px;
    border-radius:999px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--muted);
    white-space:nowrap;
  }
  .day-tab.active{
    background:var(--gold);
    color:var(--ink);
    border-color:var(--gold);
  }

  /* ---------- EVENT CARDS ---------- */
  .content{padding:20px 16px 8px;}
  .event-card{
    position:relative;
    border:1px solid var(--line);
    border-radius:14px;
    background:linear-gradient(180deg, rgba(0,0,0,0.03), transparent);
    padding:18px 18px 18px 20px;
    margin-bottom:16px;
  }
  .event-card::before{
    content:"";
    position:absolute; left:0; top:18px; bottom:18px; width:3px;
    border-radius:3px;
    background:var(--accent, var(--gold));
  }
  .event-card.tentative{opacity:0.75; border-style:dashed;}

  .ev-name{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:21px;
    color:var(--ink);
  }
  .ev-time{
    font-size:12.5px; color:var(--muted); margin-top:3px;
  }
  .ev-venue{font-size:14.5px; margin-top:10px; color:var(--ink);}
  .ev-address{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .ev-dress{
    margin-top:10px; display:inline-block; font-size:11.5px;
    padding:4px 10px; border-radius:999px;
    border:1px solid var(--line); color:var(--muted);
  }
  .dress-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:12px;
  }
  .dress-row .ev-dress{margin-top:0;}
  .dress-thumb{
    width:48px;
    height:66px;
    object-fit:cover;
    object-position:top center;
    border-radius:7px;
    border:1px solid var(--line);
    flex:none;
  }

  .travel-row{
    display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;
  }
  .badge{
    font-size:12px; padding:7px 12px; border-radius:8px;
    background:rgba(227,165,61,0.10);
    border:1px solid rgba(227,165,61,0.25);
    color:var(--gold);
    display:flex; gap:6px; align-items:center;
  }
  .badge.drive{
    background:rgba(63,143,111,0.10);
    border-color:rgba(63,143,111,0.3);
    color:#7fc9ab;
  }
  .badge.here{
    background:rgba(200,68,122,0.12);
    border-color:rgba(200,68,122,0.3);
    color:var(--magenta);
  }

  .card-actions{
    display:flex; gap:10px; margin-top:14px;
  }
  .btn{
    flex:1;
    text-align:center;
    font-size:13px;
    font-weight:500;
    padding:11px 10px;
    border-radius:9px;
    border:1px solid var(--line);
    color:var(--ink);
    text-decoration:none;
    background:rgba(0,0,0,0.03);
  }
  .btn:active{background:rgba(0,0,0,0.08);}
  .btn.primary{
    background:var(--gold);
    color:var(--ink);
    border-color:var(--gold);
  }

  .map-embed{
    margin-top:14px;
    border-radius:10px;
    overflow:hidden;
    border:1px solid var(--line);
    height:150px;
    filter:saturate(0.85) contrast(1.05);
  }
  .map-embed iframe{width:100%; height:100%; border:0; display:block;}

  /* ---------- BOTTOM HOTEL BAR ---------- */
  .hotel-bar{
    position:fixed;
    left:0; right:0; bottom:0;
    max-width:480px;
    margin:0 auto;
    background:rgba(255,255,255,0.96);
    backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    padding:12px 16px calc(12px + var(--safe-b));
    z-index:50;
  }
  .hotel-bar label{
    font-size:10.5px; text-transform:uppercase; letter-spacing:0.12em;
    color:var(--muted); display:block; margin-bottom:6px;
  }
  select#hotelSelect{
    width:100%;
    background:var(--bg-panel);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:9px;
    padding:11px 14px;
    font-family:'Space Grotesk', sans-serif;
    font-size:14px;
  }

  footer{
    text-align:center; padding:26px 24px 8px;
    color:var(--muted); font-size:11px;
  }
</style>
</head>

function haversine(lat1,lon1,lat2,lon2){
  const R=6371;
  const toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function fmtMin(m){ return m < 1 ? '<1 min' : Math.round(m)+' min'; }

const hotelSelect = document.getElementById('hotelSelect');
hotels.forEach(h=>{
  const opt = document.createElement('option');
  opt.value = h.id; opt.textContent = h.name;
  hotelSelect.appendChild(opt);
});

  { icon:'⛰️', name:'Cerro de la Cruz', tag:'20–30 min hike or tuk-tuk', blurb:'Hilltop viewpoint over the whole city and its ring of volcanoes — best in the morning for clear skies.', lat:14.5643144, lng:-90.7317686 },

];

const days = [...new Set(events.map(e=>e.day))];
days.push('Explore');
let activeDay = days[0];

const dayTabsEl = document.getElementById('dayTabs');
days.forEach(d=>{
  const btn = document.createElement('button');
  btn.className = 'day-tab' + (d===activeDay ? ' active' : '');
  btn.textContent = d;
  btn.dataset.day = d;
  btn.addEventListener('click', ()=>{ activeDay = d; render(); });
  dayTabsEl.appendChild(btn);
});

const contentEl = document.getElementById('content');

function renderTodo(){
  contentEl.innerHTML = '';
  thingsToDo.forEach(t=>{
    const card = document.createElement('div');
    card.className = 'event-card';
    const mapLink = t.lat ? `<a class="btn" style="display:inline-block; margin-top:12px;" href="https://www.google.com/maps/search/?api=1&query=${t.lat},${t.lng}" target="_blank" rel="noopener">View on map</a>` : '';
    card.innerHTML = `
      <div class="ev-name">${t.icon} ${t.name}</div>
      <div class="ev-time">${t.tag}</div>
      <div class="ev-address" style="margin-top:8px; font-size:13.5px; line-height:1.5;">${t.blurb}</div>
      ${mapLink}
    `;
    contentEl.appendChild(card);
  });
}

function render(){
  document.querySelectorAll('.day-tab').forEach(t=>{
    t.classList.toggle('active', t.dataset.day === activeDay);
  });

  if(activeDay === 'Explore'){
    renderTodo();
    return;
  }

  const hotel = hotels.find(h=>h.id===hotelSelect.value);
  contentEl.innerHTML = '';

  events.filter(ev=>ev.day===activeDay).forEach(ev=>{
    const card = document.createElement('div');
    card.className = 'event-card' + (ev.tentative ? ' tentative' : '');
    card.style.setProperty('--accent', ev.accent);

    let travelHTML = '';
    let actionsHTML = '';
    let mapHTML = '';

    if(!ev.tentative){
      const dist = haversine(hotel.lat, hotel.lng, ev.lat, ev.lng);
      if(dist < 0.05){
        travelHTML = `<div class="travel-row"><span class="badge here">At your hotel</span></div>`;
      } else {
        const walk = dist/5*60;
        const drive = Math.max(dist/20*60 + 3, 4);
        travelHTML = `<div class="travel-row">
          <span class="badge">🚶 ${fmtMin(walk)}</span>
          <span class="badge drive">🚗 ${fmtMin(drive)}</span>
        </div>`;
      }
      const mapsHref = `https://www.google.com/maps/dir/?api=1&origin=${hotel.lat},${hotel.lng}&destination=${ev.lat},${ev.lng}`;
      actionsHTML = `<div class="card-actions">
        <a class="btn primary" href="${mapsHref}" target="_blank" rel="noopener">Get directions</a>
      </div>`;
      mapHTML = `<div class="map-embed">
        <iframe loading="lazy" src="https://www.google.com/maps?q=${ev.lat},${ev.lng}&hl=en&z=16&output=embed"></iframe>
      </div>`;
    }

    card.innerHTML = `
      <div class="ev-name">${ev.name}</div>
      <div class="ev-time">${ev.dayFull} · ${ev.time}</div>
      <div class="ev-venue">${ev.venue}</div>
      <div class="ev-address">${ev.address}</div>
      ${ev.dress ? `
        <div class="dress-row">
          ${ev.dressImg ? `<img class="dress-thumb" src="${ev.dressImg}" alt="${ev.name} dress code reference">` : ''}
          <div class="ev-dress">${ev.dress}</div>
        </div>` : ''}
      ${travelHTML}
      ${actionsHTML}
      ${mapHTML}
    `;
    contentEl.appendChild(card);
  });
}

hotelSelect.addEventListener('change', render);
render();
